apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.microservice.name }}-secrets
  namespace: {{ .Values.microservice.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET }}
  MAIL_USERNAME: {{ .Values.secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: {{ .Values.secrets.MAIL_PASSWORD }}
