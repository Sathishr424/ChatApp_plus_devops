server {
    listen 80;
    server_name satdevopsdummies.xyz www.satdevopsdummies.xyz;

    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name satdevopsdummies.xyz www.satdevopsdummies.xyz;

    ssl_certificate /etc/letsencrypt/live/satdevopsdummies.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satdevopsdummies.xyz/privkey.pem;

    #listen 80;
    #server_name satdevopsdummies.xyz www.satdevopsdummies.xyz;

    ## Let's Encrypt
    #location /.well-known/acme-challenge/ {
    #    root /var/www/certbot;
    #}

    # -------------------------
    # React Client
    # -------------------------
    location / {
        proxy_pass http://client:5173;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # API
    # /api/*
    # -------------------------
    location /api/ {
        proxy_pass http://backend:5001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Socket.IO
    # /socket.io/*
    # -------------------------
    location /socket.io {
        proxy_pass http://socket:5002;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # File Storage
    # /files/*
    # -------------------------
    location /files {
      proxy_pass http://storage:5123;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      client_max_body_size 100M;
    }
}
