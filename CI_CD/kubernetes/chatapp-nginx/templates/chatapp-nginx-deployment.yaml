---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name:  {{ .Values.microservice.namespace }}
        app.kubernetes.io/component: nginx
        app.kubernetes.io/instance: {{ .Values.microservice.name }}
    spec:
      containers:
      - name: {{ .Values.microservice.name }}
        image: {{ .Values.workload.image }}
        resources:
          requests:
            cpu: {{ .Values.workload.resources.min.cpu }}
            memory: {{ .Values.workload.resources.min.memory }}
        ports:
        - containerPort: {{ .Values.workload.port }}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
        readinessProbe:
          exec:
            command:
              - nginx
              - -t
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          exec:
            command:
              - nginx
              - -t
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: nginx-config
        configMap:
          name: {{ .Values.microservice.name }}-config
