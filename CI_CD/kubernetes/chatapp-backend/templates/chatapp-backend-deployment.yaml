---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name:  {{ .Values.microservice.namespace }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Values.microservice.name }}
    spec:
      containers:
      - name: {{ .Values.microservice.name }}
        image: {{ .Values.workload.image }}
        envFrom:
          - configMapRef:
              name: {{ .Values.microservice.name }}-config
          - secretRef:
              name: {{ .Values.microservice.name }}-secrets
        resources:
          requests:
            cpu: {{ .Values.workload.resources.min.cpu }}
            memory: {{ .Values.workload.resources.min.memory }}
        ports:
        - containerPort: {{ .Values.workload.port }}

        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.workload.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.workload.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
