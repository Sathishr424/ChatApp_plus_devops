---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name:  {{ .Values.microservice.namespace }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/instance: {{ .Values.microservice.name }}
    spec:
      containers:
      - name: {{ .Values.microservice.name }}
        image: {{ .Values.workload.image }}
        resources:
          requests:
            cpu: {{ .Values.workload.resources.min.cpu }}
            memory: {{ .Values.workload.resources.min.memory }}
        ports:
        - containerPort: {{ .Values.workload.port }}
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          exec:
            command:
              - redis-cli
              - ping
          periodSeconds: 5
          failureThreshold: 12
          timeoutSeconds: 3
