services:
  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    image: satdevpurpose/chat-client:latest
    build: "./client/"
    env_file:
      - .env
    ports:
      - "5173:5173"

  backend:
    image: satdevpurpose/chat-backend:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile.backend
    depends_on:
      chat-db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5001:5001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://localhost:5001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  socket:
    image: satdevpurpose/chat-socket:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile.socket
    depends_on:
      chat-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5002:5002"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://localhost:5002/health",
        ]
      interval: 20s
      timeout: 10s
      retries: 4
      start_period: 60s

  storage:
    image: satdevpurpose/chat-storage:latest
    build: "./storage/"
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    ports:
      - "5123:5123"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://localhost:5123/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chat-db:
    image: postgres:alpine3.24
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
